[project]
name = "noobase-workspace"
version = "0.0.0"
description = "Dev shell for the noobase Cargo + uv workspace (not published)"
requires-python = ">=3.14"
dependencies = ["noobase"]

[tool.uv]
package = false

[tool.uv.sources]
noobase = { workspace = true }

[tool.uv.workspace]
members = ["crates/noobase-py"]

[dependency-groups]
dev = ["maturin>=1.8,<2", "pytest>=8"]
